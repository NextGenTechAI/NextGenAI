<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Tech Canvas Background -->
  <rect width="120" height="120" rx="28" fill="#040711" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  
  <!-- Circuit Grid Outline -->
  <path d="M60 14 L98 36 L98 84 L60 106 L22 84 L22 36 Z" fill="rgba(6, 182, 212, 0.05)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Neural N Shape -->
  <path d="M32 78 L32 40 C32 35 37 31 42 33 L52 39 C56 42 58 46 58 51 L58 88 C58 93 53 97 48 95 L39 89 C35 87 32 83 32 78 Z" fill="url(#favPrimary)" />
  <path d="M40 36 L78 84 C81 88 87 88 90 84 L94 79 C97 75 96 69 92 65 L54 18 C50 14 44 15 41 19 Z" fill="url(#favAccent)" opacity="0.9" />
  <path d="M68 54 L68 22 C68 17 73 13 78 15 L88 21 C93 24 96 29 96 35 L96 73 C96 78 91 82 86 80 L76 74 C71 71 68 66 68 61 Z" fill="url(#favPrimary)" />

  <!-- Synapse Nodes -->
  <circle cx="32" cy="40" r="4.5" fill="#00F0FF" filter="url(#favGlow)" />
  <circle cx="96" cy="73" r="4.5" fill="#8B5CF6" filter="url(#favGlow)" />
  <circle cx="60" cy="56" r="5" fill="#FFFFFF" filter="url(#favGlow)" />
  <circle cx="60" cy="20" r="3" fill="#00F0FF" />
  <circle cx="60" cy="94" r="3" fill="#8B5CF6" />

  <!-- Connecting Lines -->
  <line x1="32" y1="40" x2="60" y2="56" stroke="#00F0FF" stroke-width="1.5" />
  <line x1="60" y1="56" x2="96" y2="73" stroke="#8B5CF6" stroke-width="1.5" />
</svg>
