<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Abstract AI Nexus Icon (Geometric 'N' Neural Core) -->
  <g transform="translate(15, 12)" filter="url(#softShadow)">
    <!-- Circuit Base Grid Elements -->
    <path d="M58 8 L98 32 L98 84 L58 108 L18 84 L18 32 Z" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Central Geometric Neural Icon -->
    <!-- Left Pillar -->
    <path d="M28 80 L28 36 C28 31 33 27 38 29 L50 36 C55 39 58 44 58 50 L58 92 C58 97 53 101 48 99 L36 92 C31 89 28 85 28 80 Z" 
          fill="url(#primaryGrad)" />
    
    <!-- Diagonal Neural Bridge -->
    <path d="M38 32 L78 84 C81 88 87 88 90 84 L94 79 C97 75 96 69 92 65 L52 14 C48 10 42 11 39 15 Z" 
          fill="url(#accentGrad)" opacity="0.9" />

    <!-- Right Pillar -->
    <path d="M68 56 L68 20 C68 15 73 11 78 13 L90 20 C95 23 98 28 98 34 L98 76 C98 81 93 85 88 83 L76 76 C71 73 68 68 68 63 Z" 
          fill="url(#primaryGrad)" />

    <!-- Neural Synapse Nodes -->
    <circle cx="28" cy="36" r="4.5" fill="#00F0FF" filter="url(#neonGlow)" />
    <circle cx="98" cy="78" r="4.5" fill="#8B5CF6" filter="url(#neonGlow)" />
    <circle cx="58" cy="58" r="5" fill="#FFFFFF" filter="url(#neonGlow)" />
    <circle cx="58" cy="18" r="3.5" fill="#00F0FF" />
    <circle cx="58" cy="98" r="3.5" fill="#8B5CF6" />

    <!-- Connecting Synapse Lines -->
    <line x1="28" y1="36" x2="58" y2="58" stroke="#00F0FF" stroke-width="1.8" opacity="0.8" />
    <line x1="58" y1="58" x2="98" y2="78" stroke="#8B5CF6" stroke-width="1.8" opacity="0.8" />
    <line x1="58" y1="18" x2="58" y2="58" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="58" y1="58" x2="58" y2="98" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6" />
  </g>

  <!-- Typography: NextGenAI Wordmark -->
  <g transform="translate(140, 20)">
    <!-- Brand Name "NextGen" -->
    <text x="0" y="65" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      NextGen<tspan fill="url(#primaryGrad)">AI</tspan>
    </text>

    <!-- AI Core Pill Badge -->
    <rect x="290" y="30" width="70" height="26" rx="13" fill="rgba(0, 240, 255, 0.12)" stroke="url(#primaryGrad)" stroke-width="1.2" />
    <circle cx="304" cy="43" r="3.5" fill="#00F0FF" filter="url(#neonGlow)" />
    <text x="314" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1.5">TECH</text>

    <!-- Subtitle / Brand Ethos -->
    <text x="3" y="90" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" letter-spacing="2.8">
      CAREERS <tspan fill="#3B82F6">•</tspan> BUSINESS <tspan fill="#00F0FF">•</tspan> INTELLIGENCE
    </text>
  </g>
</svg>
